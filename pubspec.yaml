name: patrol_recorder
description: Debug Flutter interaction recording with tree-aware targets and live, copyable Patrol Dart code.
version: 0.0.7
repository: https://github.com/anandsubbu007/patrol-code-generator
issue_tracker: https://github.com/anandsubbu007/patrol-code-generator/issues
topics:
  - testing
  - devtools
  - patrol
  - recording
screenshots:
  - description: Local demonstration login used to record a Flutter journey.
    path: doc/images/login.png
  - description: Account overview reached by the demonstration journey.
    path: doc/images/account.png
  - description: Repeated controls with ancestor-scoped selectors.
    path: doc/images/repeated-controls.png
  - description: M2 fixture lab showing fictional customer data and exact-text/count outcomes.
    path: doc/images/fixture-lab.png
  - description: Fixture lab at a narrow browser viewport, not a native-platform claim.
    path: doc/images/fixture-lab-mobile.png
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  patrol: 4.10.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
