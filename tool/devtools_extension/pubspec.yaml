name: patrol_recorder_devtools
description: DevTools interface for recording and copying Patrol code.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  patrol_recorder:
    path: ../..
  devtools_extensions: 0.5.1
  devtools_app_shared: 0.5.1
  dtd: 4.0.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  patrol_recorder:
    path: ../..

flutter:
  uses-material-design: true
