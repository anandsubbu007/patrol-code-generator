name: patrol_recorder_example
description: Runnable local-only Patrol Recorder demonstration.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  patrol_recorder_generator:
    path: ../tool/patrol_recorder_generator
  patrol_recorder:
    path: ..
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: 4.10.0
  patrol_finders: 3.6.0

flutter:
  uses-material-design: true

patrol:
  app_name: Patrol Recorder Example
  test_directory: patrol_test

recorder_config:
  recordings_directory: patrol_recorder
  screenshots_directory: patrol_recorder/screenshots
  output_directory: patrol_test/recorded_journeys
  journey_id: login
  case_id: sign_in
  case_name: Sign in with demonstration profile
  profile: demo
