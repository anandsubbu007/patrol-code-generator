name: patrol_recorder_example
description: Runnable local-only Patrol Recorder demonstration.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  patrol_recorder:
    path: ..
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  patrol: 4.10.0
  patrol_finders: 3.6.0

flutter:
  uses-material-design: true

patrol:
  app_name: Patrol Recorder Example
  test_directory: patrol_test
