# Manually authored schema-5 example. Do not re-record over this maintained file.
schema_version: 5
journey:
  id: m2_fixtures
  name: Fixture and expectation lab
state: stopped
assets:
  customer:
    path: assets/m2_fixtures/customer.json
    format: json
  note:
    path: assets/m2_fixtures/note.txt
    format: text
inputs:
  email: { type: string }
  quantity: { type: integer }
  enabled: { type: boolean }
  credit: { type: number }
  options: { type: json }
profiles:
  demo:
    email: ada@example.invalid
    quantity: 2
    enabled: true
    credit: 24.5
    options: { source: local_fixture }
  empty:
    email: empty@example.invalid
    quantity: 0
    enabled: false
    credit: 0.0
    options: { source: local_fixture }
setup:
  seed:
    - { id: customer, action: asset, asset: customer }
    - { id: note, action: asset, asset: note }
groups:
  enter_lab:
    - { id: login, action: tap, target: { key: login } }
    - { id: open, action: tap, target: { text: Fixture and expectation lab } }
cases:
  - id: populated
    name: Seed a populated local fixture
    profile: demo
    setup: [seed]
    data: { quantity: 2 }
    selector_overrides:
      open_lab_open: { key: open_fixtures }
    steps:
      - { id: open_lab, action: group, group: enter_lab }
      - id: customer_name
        action: expect
        target: { key: fixture_name }
        expectation: { kind: text, value: Ada Fixture }
      - id: enabled
        action: expect
        target: { key: fixture_status }
        expectation: { kind: text, value: Enabled }
      - id: credit
        action: expect
        target: { key: fixture_credit }
        expectation: { kind: text, value: "Credit: 24.50" }
      - id: items
        action: expect
        target: { text: Fixture item }
        expectation: { kind: count, value: 2 }
      - id: note
        action: expect
        target: { key: fixture_note }
        expectation:
          { kind: text, value: Fictional local data. No network requests. }
  - id: empty
    name: Seed an empty disabled local fixture
    profile: empty
    setup: [seed]
    selector_overrides:
      open_lab_open: { key: open_fixtures }
    steps:
      - { id: open_lab, action: group, group: enter_lab }
      - id: customer_email
        action: expect
        target: { key: fixture_email }
        expectation: { kind: text, value: empty@example.invalid }
      - id: disabled
        action: expect
        target: { key: fixture_status }
        expectation: { kind: text, value: Disabled }
      - id: no_items
        action: expect
        target: { text: Fixture item }
        expectation: { kind: count, value: 0 }
