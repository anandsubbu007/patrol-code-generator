name: CI

on:
  push:
    branches-ignore:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', '3.47.7']
    steps:
      - uses: actions/checkout@v4

      - name: Test release helpers
        run: python3 -m unittest discover -s tool/tests -v

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Check Dart formatting
        if: matrix.flutter == '3.47.7'
        run: |
          dart format --language-version=latest --output=none --set-exit-if-changed \
            lib test \
            tool/devtools_extension/lib tool/devtools_extension/test tool/devtools_extension/tool \
            example/lib example/test example/patrol_test

      - name: Test recorder package
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test

      - name: Test and validate DevTools extension
        working-directory: tool/devtools_extension
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart run devtools_extensions build_and_copy --source=. --dest=../../extension/devtools
          dart run devtools_extensions validate --package=../..

      - name: Test example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.0
          cache: true
      - name: Test minimum recorder and example SDK
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test
          cd example
          flutter pub get
          flutter analyze
          flutter test
