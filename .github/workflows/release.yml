name: Publish packages

on:
  push:
    branches:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: pub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release-branch:
    if: >-
      github.ref_type == 'branch' && !startsWith(github.event.head_commit.message, format('chore: prepare {0}', github.ref_name))
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that can trigger the tag workflow
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error::Set RELEASE_TAG_TOKEN (repository Contents: read/write) for branch-to-tag releases, or push a version tag yourself."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
          fetch-depth: 0
      - name: Prepare coordinated versions
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: python3 tool/prepare_release.py "$RELEASE_REF" --from-ref --apply
      - name: Commit prepared versions and create release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            echo "::error::Tag $RELEASE_REF already exists. Never move a published release tag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml tool/patrol_recorder_generator/pubspec.yaml \
            README.md tool/patrol_recorder_generator/README.md doc/PUBLISHING.md \
            CONTRIBUTING.md CHANGELOG.md tool/patrol_recorder_generator/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare $RELEASE_REF" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          fi
          git tag "$RELEASE_REF"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_REF" "refs/tags/$RELEASE_REF"

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Prepare versions from the tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: python3 tool/prepare_release.py "$RELEASE_REF" --from-ref --apply
      - name: Test release helpers
        run: python3 -m unittest discover -s tool/tests -v
      - name: Validate all components and build packaged extension
        run: |
          dart format --language-version=latest --output=none --set-exit-if-changed \
            lib test \
            tool/patrol_recorder_generator/lib tool/patrol_recorder_generator/bin tool/patrol_recorder_generator/test \
            tool/devtools_extension/lib tool/devtools_extension/test tool/devtools_extension/tool \
            example/lib example/test example/patrol_test
          flutter pub get
          flutter analyze lib test
          flutter test
          (
            cd tool/patrol_recorder_generator
            flutter pub get
            flutter analyze
            flutter test
          )
          (
            cd tool/devtools_extension
            flutter pub get
            flutter analyze
            flutter test
            dart run devtools_extensions build_and_copy --source=. --dest=../../extension/devtools
            dart run devtools_extensions validate --package=../..
          )
          (
            cd example
            flutter pub get
            flutter analyze
            flutter test
          )
      - name: Preserve the generated release changes
        run: git diff --binary > release.patch
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-changes-${{ github.ref_name }}
          path: release.patch
      - name: Snapshot generated release files for clean archive validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: snapshot release archive" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          fi
          rm release.patch
      - name: Configure pub.dev OIDC authentication
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - name: Publish recorder then hosted-dependent generator
        run: python3 tool/release_ci.py
